# Blueprint do Render.
#
# Demonstração para o cliente: sistema + catraca SIMULADA, com os dados num Postgres do Render.
# O que for cadastrado fica salvo (não some mais ao reiniciar). Na primeira vez o banco é preenchido
# com dados fictícios e usuários de teste (senha demo1234).
#
# Atenção: o Postgres do plano free do Render expira 30 dias depois de criado. Para uso de verdade,
# use um plano pago ou leve para a VPS (basta apontar DATABASE_URL para o Postgres de lá).
databases:
  - name: portal-escolar-db
    plan: free
    databaseName: escola
    user: escola

services:
  - type: web
    name: portal-escolar-demo-catraca
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node servidor/demo-online.js
    healthCheckPath: /api/sessao
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: portal-escolar-db
          property: connectionString
