# Blueprint do Render: site estático, sem build.
services:
  - type: web
    name: portal-escolar-futuro
    runtime: static
    buildCommand: echo "Site estático, sem etapa de build"
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # página principal sem cache, para cada atualização aparecer na hora
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache

  # Demonstração da catraca Control iD com catraca SIMULADA (não fala com equipamento real).
  # Sobe o portal + a ponte + o simulador num só processo. O cliente testa pelo navegador.
  - type: web
    name: portal-escolar-demo-catraca
    runtime: node
    plan: free
    buildCommand: echo "Sem dependências para instalar"
    startCommand: node ponte-catraca/demo-online.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
