<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sistema de gestão escolar: turmas, alunos, diários, boletins e controle de acesso.">
<meta name="theme-color" content="#f5f9fe">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Portal Escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div id="carregando" class="entrar"><p class="muted">Carregando…</p></div>
<div id="entrar" class="entrar" hidden></div>

<div id="app" hidden>
  <header class="top">
    <button class="top-btn menu-toggle" id="menuBtn" aria-label="Abrir menu"></button>
    <a class="logo" href="#principal">
      <svg viewBox="0 0 42 42" aria-hidden="true">
        <circle cx="21" cy="21" r="20" fill="#e7f1fd"/>
        <circle cx="21" cy="21" r="13" fill="none" stroke="#3d8fe6" stroke-width="2"/>
        <path d="M8 21h26M21 8c-5 4-5 22 0 26M21 8c5 4 5 22 0 26" fill="none" stroke="#3d8fe6" stroke-width="1.6"/>
      </svg>
      <div><b id="escolaNome">Portal escolar</b><small>Sistema de gestão escolar</small></div>
    </a>
    <div class="top-actions" id="topActions"></div>
  </header>

  <div class="shell">
    <aside class="side" id="side" aria-label="Menu">
      <div class="user"><div class="av" id="userAv"></div><div><b id="userNome"></b><small id="userPapel"></small></div></div>
      <ul class="menu" id="menu"></ul>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="view" id="view"></main>
  </div>
  <a class="help" id="helpBtn" href="#suporte" aria-label="Falar com o suporte"></a>
</div>
<div id="layer"></div>

<script src="js/base.js"></script>
<script src="js/dados.js"></script>
<script src="js/secretaria.js"></script>
<script src="js/academico.js"></script>
<script src="js/matriculas.js"></script>
<script src="js/catraca.js"></script>
<script src="js/config.js"></script>
<script src="js/comunicacao.js"></script>
<script src="js/pedagogico.js"></script>
<script src="js/financeiro.js"></script>
<script src="js/iniciar.js"></script>
</body>
</html>
